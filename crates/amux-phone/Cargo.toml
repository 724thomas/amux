[package]
name = "amux-phone"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Phone sidecar for amux: serves a small HTTP API over the running app's local socket"

[[bin]]
name = "amux-phone"
path = "src/main.rs"

[dependencies]
amux-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
# Same local IPC the CLI uses: Unix domain socket on Unix, named pipe on Windows.
interprocess = { version = "2", features = ["tokio"] }
# Terminal QR for the one-time pairing code — no image backend needed.
qrcode = { version = "0.14", default-features = false }
