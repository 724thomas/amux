[package]
name = "amux-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Engine for amux: PTY management, terminal state, metadata, notifications, socket server"

[dependencies]
amux-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
indexmap = { workspace = true }
portable-pty = "0.9.0"
alacritty_terminal = "0.26.0"
notify-rust = "4.17.0"
# Cross-platform local IPC: Unix domain socket on Unix, named pipe on Windows.
interprocess = { version = "2", features = ["tokio"] }

# Windows: detect whether the pane's shell has a live child process (the
# "a command is running" signal — no foreground process group under ConPTY).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
] }
