[package]
name = "amux-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Engine for amux: PTY management, terminal state, metadata, notifications, socket server"

[dependencies]
amux-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
indexmap = { workspace = true }
portable-pty = "0.9.0"
alacritty_terminal = "0.26.0"
notify-rust = "4.17.0"
# Cross-platform local IPC: Unix domain socket on Unix, named pipe on Windows.
interprocess = { version = "2", features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
libproc = "0.14.11"

# Windows has no foreground process group and no procfs, so the pane
# metadata the sidebar shows is assembled from Win32 directly:
#   ToolHelp  — the pane shell's process tree (what is running in the pane)
#   Threading — process creation times, to pick the newest child of the shell
#   IpHelper  — the TCP table, for LISTEN ports owned by that tree
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }
# A process's working directory lives in its PEB, at offsets Windows does not
# document; sysinfo already reads it (and handles the 32/64-bit mismatch), so
# we ask it rather than hard-coding those offsets here.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
